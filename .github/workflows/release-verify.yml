name: Verify local app

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and package
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Record toolchain and artifact metadata
        id: metadata
        shell: bash
        run: |
          xcodebuild -version
          swift --version
          source ./script/app_metadata.sh
          echo "artifact_name=$ARTIFACT_NAME-$VERSION-$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check helper syntax
        shell: bash
        run: |
          for script_path in script/*.sh Resources/setup_local_mlx.sh Release/build_open_source_release.sh; do
            bash -n "$script_path"
          done
          python3 -c 'import ast, pathlib; ast.parse(pathlib.Path("Resources/local_mlx_watchdog.py").read_text())'

      - name: Verify packaging permissions
        run: ./script/verify_packaging_permissions.sh

      - name: Run tests
        run: swift test

      - name: Build local release artifacts
        run: ./Release/build_open_source_release.sh all

      - name: Verify bundles, archives, and checksums
        run: ./script/verify_packaging_permissions.sh --release-artifacts

      - name: Upload verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            Release/product/*.zip
            Release/product/*.dmg
            Release/product/*.sha256
          if-no-files-found: error
          retention-days: 7
